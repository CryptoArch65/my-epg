name: Provjera EPG izvora

on:
  workflow_dispatch:
  pull_request:
    paths:
      - config/epg-check.json
      - scripts/check_epg.js
      - scripts/check_mtel.js
      - scripts/check_mtel.test.js
      - scripts/check_maxtv.js
      - scripts/check_maxtv.test.js
      - scripts/check_telemach.js
      - .github/workflows/epg-check.yml
  push:
    branches: [main]
    paths:
      - config/epg-check.json
      - scripts/check_epg.js
      - scripts/check_mtel.js
      - scripts/check_mtel.test.js
      - scripts/check_maxtv.js
      - scripts/check_maxtv.test.js
      - scripts/check_telemach.js
      - .github/workflows/epg-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Provjeri konfiguraciju i odabir programa
        run: node --test scripts/check_telemach.test.js scripts/check_mtel.test.js scripts/check_maxtv.test.js
      - name: Preuzmi EPG adaptere
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg
      - name: Instaliraj zavisnosti
        working-directory: epg
        run: npm ci
      - name: Provjeri izabrani izvor
        run: node scripts/check_epg.js
      - name: Prikaži rezultate u sažetku
        run: cat reports/epg-check.md >> "$GITHUB_STEP_SUMMARY"
      - name: Sačuvaj izvještaj i logotipe
        uses: actions/upload-artifact@v4
        with:
          name: epg-provjera
          path: reports/
          if-no-files-found: error
          retention-days: 7
