name: Review TVProfil M3U matches

on:
  workflow_dispatch:

jobs:
  match:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Probe known Arena Sport schedule without publishing
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><tv><channel id="ArenaSport1.ba"><display-name>Arena Sport 1</display-name></channel></tv>' > probe.xml
          printf '%s\n' '[{"xmltv_id":"ArenaSport1.ba","slug":"tv-arena-sport-1-hr","display_name":"Arena Sport 1"}]' > probe.json
          python scripts/import_tvprofil.py probe.xml probe.json
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('probe.xml').getroot()
          print('PROBE programmes:', len(root.findall('programme')))
          PY
      - name: Build review report
        run: |
          python scripts/match_tvprofil_channels.py \
            --channels config/tvprofil_playlist_channels.csv \
            --report tvprofil_match_review.csv \
            --output-config tvprofil_channels.runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: tvprofil-match-review
          path: |
            tvprofil_match_review.csv
            tvprofil_channels.runtime.json
