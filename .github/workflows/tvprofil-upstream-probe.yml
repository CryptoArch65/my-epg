name: Probe upstream TVProfil grabber

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tvprofil-upstream-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Clone upstream epg and install dependencies
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg
          cd epg
          npm ci
      - name: Probe only BHT1 and FTV for one day
        run: |
          cat > probe.channels.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channels>
            <channel site="tvprofil.com" site_id="ba/tvprogram#bht1" lang="bs" xmltv_id="BHT1.ba">BHT1</channel>
            <channel site="tvprofil.com" site_id="ba/tvprogram#ftv" lang="bs" xmltv_id="Federalnatelevizija.ba">FTV</channel>
          </channels>
          XML
          cd epg
          npm run grab --- --channels=../probe.channels.xml --output=../probe.guide.xml --days=1 --maxConnections=1 --delay=1000 --timeout=30000 2>&1 | tee ../probe.log
      - name: Count returned programmes
        if: always()
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('probe.guide.xml')
          if not path.exists():
              print('No XMLTV output file was generated')
              raise SystemExit(1)
          root = ET.parse(path).getroot()
          counts = Counter(p.get('channel') for p in root.findall('programme'))
          print('Programme counts:', dict(counts))
          if not counts.get('BHT1.ba') or not counts.get('Federalnatelevizija.ba'):
              raise SystemExit('At least one channel has no programmes')
          PY
      - name: Upload isolated probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvprofil-upstream-probe
          path: |
            probe.log
            probe.guide.xml
          if-no-files-found: ignore
