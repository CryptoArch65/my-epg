name: Update Informer TV MTS EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/informer-mts.xml
      - scripts/merge_xmltv.py
      - .github/workflows/informer-mts.yml
  workflow_run:
    workflows: ["Update EPG"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: informer-mts-epg
  cancel-in-progress: false

jobs:
  update-informer:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Fix encoded MTS channel IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('epg/sites/mts.rs/mts.rs.config.js')
          s = p.read_text(encoding='utf-8')
          old = "const channelData = data.products.find(c => c.code === channel.site_id)"
          new = "const channelData = data.products.find(c => c.code === decodeURIComponent(channel.site_id))"
          if old not in s:
              raise SystemExit('MTS parser pattern changed upstream')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Install grabber dependencies
        working-directory: epg
        run: npm ci

      - name: Grab Informer TV from MTS
        working-directory: epg
        run: |
          npm run grab --- \
            --channels=../config/informer-mts.xml \
            --output=../informer-mts.xml \
            --maxConnections=2

      - name: Merge Informer MTS EPG into guide
        run: python3 scripts/merge_xmltv.py guide.xml informer-mts.xml guide.informer.xml

      - name: Validate Informer EPG
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter

          root = ET.parse('guide.informer.xml').getroot()
          channel = next((c for c in root.findall('channel') if c.get('id') == 'informertv.rs'), None)
          if channel is None:
              raise SystemExit('Missing informertv.rs channel')
          counts = Counter(p.get('channel') for p in root.findall('programme'))
          if counts['informertv.rs'] == 0:
              raise SystemExit('No MTS programmes for informertv.rs')
          print('informertv.rs', counts['informertv.rs'], 'programmes')
          PY

      - name: Restore Informer logo
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = 'guide.informer.xml'
          tree = ET.parse(path)
          root = tree.getroot()
          channel = next((c for c in root.findall('channel') if c.get('id') == 'informertv.rs'), None)
          if channel is None:
              raise SystemExit('Missing informertv.rs channel')
          for icon in list(channel.findall('icon')):
              channel.remove(icon)
          ET.SubElement(channel, 'icon', {
              'src': 'https://raw.githubusercontent.com/CryptoArch65/my-epg/main/logos/m3u-serbia-c69abbf615166141.png'
          })
          tree.write(path, encoding='utf-8', xml_declaration=True)
          print('Informer logo restored for informertv.rs')
          PY

      - name: Publish guide
        run: |
          mv guide.informer.xml guide.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BACKUP_DIR=$(mktemp -d)
          cp guide.xml "$BACKUP_DIR/guide.xml"

          pushed=0
          for attempt in $(seq 1 5); do
            echo "Publish attempt $attempt of 5..."
            git fetch origin main
            git reset --hard origin/main
            cp "$BACKUP_DIR/guide.xml" guide.xml
            git add guide.xml
            if git diff --cached --quiet; then
              echo "Informer MTS EPG has not changed"
              pushed=1
              break
            fi
            git commit -m "Update Informer TV MTS EPG"
            if git push origin HEAD:main; then
              echo "Successfully pushed Informer TV MTS EPG"
              pushed=1
              break
            fi
            echo "Push rejected (concurrent push to main), retrying in 3s..."
            sleep 3
          done
          rm -rf "$BACKUP_DIR"
          if [ "$pushed" -ne 1 ]; then
            echo "Failed to push Informer TV MTS EPG after 5 attempts" >&2
            exit 1
          fi
