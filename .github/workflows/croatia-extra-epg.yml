name: Update Croatia Extra EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/croatia-extra-channels.xml
      - config/croatia-playlist-aliases.csv
      - config/m3u-croatia-playlist-logos.csv
      - scripts/merge_xmltv.py
      - scripts/add_croatia_epg_aliases.py
      - scripts/apply_m3u_croatia_playlist_logos.py
      - scripts/import_nova_cinema_raspored.py
      - .github/workflows/croatia-extra-epg.yml
  workflow_run:
    workflows: ["Update EPG"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: croatia-extra-epg
  cancel-in-progress: false

jobs:
  update-croatia-extra:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Install grabber dependencies
        working-directory: epg
        run: npm ci

      - name: Grab extra Croatia channels
        working-directory: epg
        run: |
          npm run grab --- \
            --channels=../config/croatia-extra-channels.xml \
            --output=../croatia-extra.xml \
            --maxConnections=3

      - name: Merge extra Croatia EPG into guide
        run: python3 scripts/merge_xmltv.py guide.xml croatia-extra.xml guide.merged.xml

      - name: Install Python dependencies
        run: python3 -m pip install Pillow lxml

      - name: Import Nova Cinema schedule from raspored.tv
        run: python3 scripts/import_nova_cinema_raspored.py guide.merged.xml

      - name: Add Croatia playlist aliases
        run: python3 scripts/add_croatia_epg_aliases.py guide.merged.xml config/croatia-playlist-aliases.csv

      - name: Apply Croatia provider logos
        run: python3 scripts/apply_m3u_croatia_playlist_logos.py guide.merged.xml config/m3u-croatia-playlist-logos.csv logos

      - name: Validate extra channel data
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter

          root = ET.parse('guide.merged.xml').getroot()
          wanted = ['htv5', 'N1Croatia.hr', 'zdravatv.hr', 'nova-plus-cinema']
          required_epg = ['N1Croatia.hr', 'zdravatv.hr', 'nova-plus-cinema']
          channels = {c.get('id') for c in root.findall('channel')}
          counts = Counter(p.get('channel') for p in root.findall('programme'))
          for channel_id in wanted:
              if channel_id not in channels:
                  raise SystemExit(f'Missing Croatia channel: {channel_id}')
              print(channel_id, counts[channel_id], 'programmes')
          for channel_id in required_epg:
              if counts[channel_id] == 0:
                  raise SystemExit(f'No programmes for required Croatia channel: {channel_id}')
          if counts['htv5'] == 0:
              print('WARNING: HRT INT currently has no programme data from available sources; publishing channel/logo only')
          PY

      - name: Publish Croatia-enhanced guide
        run: |
          mv guide.merged.xml guide.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml logos/
          if git diff --cached --quiet; then
            echo "Croatia extra EPG has not changed"
            exit 0
          fi
          git commit -m "Update Croatia extra EPG"
          git push
