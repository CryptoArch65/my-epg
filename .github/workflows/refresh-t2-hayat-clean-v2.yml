name: Refresh T2 Hayat clean-v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-t2-hayat-clean-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Refresh Hayat channels from T-2
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          import requests
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          BASE = "https://player-stage.t-2.net/"
          VERSION = "11.10"
          CLIENT_ID = "7180361494733769941"
          PUBLIC_KEY = "307b2976-aa5f-4664-837e-74a4c91d5de8"
          PREFIX = f"Catherine/api/{VERSION}/json/{CLIENT_ID}/"
          SIGNING = PUBLIC_KEY + VERSION + "json" + CLIENT_ID

          CHANNELS = {
              1000913: {
                  "canonical": "HayatZivotIStil.ba",
                  "alias": "hayatživotistil.ba",
                  "display": "|BIH| HAYAT STIL ZIVOT",
                  "logo": BASE + "static/media/img/channels/dark/medium/4800648.png",
              },
              1000918: {
                  "canonical": "HayatLoveBox.ba",
                  "alias": "hayatlovebox.ba",
                  "display": "|BIH| HAYAT LOVE BOX",
                  "logo": BASE + "static/media/img/channels/dark/medium/4820306.png",
              },
          }

          def call_epg(channel_id):
              now = datetime.now(timezone.utc)
              start = datetime(now.year, now.month, now.day, tzinfo=timezone.utc) - timedelta(hours=2)
              end = start + timedelta(days=4)
              action = "client/tv/getEpg"
              payload = {
                  "locale": "en-GB",
                  "returnDummyEpg": True,
                  "channelId": [channel_id],
                  "startTime": int(start.timestamp() * 1000),
                  "endTime": int(end.timestamp() * 1000),
                  "imageInfo": [{"height": 360, "width": 640}],
                  "includeBookmarks": True,
                  "includeShow": True,
                  "includeProfileContentId": True,
              }
              body = json.dumps(payload, separators=(",", ":"), ensure_ascii=False)
              sig = hashlib.md5((SIGNING + action + body).encode("utf-8")).hexdigest()
              url = f"{BASE}{PREFIX}{sig}/{action}"
              response = requests.post(
                  url,
                  data=body.encode("utf-8"),
                  headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json", "Content-Type": "application/json"},
                  timeout=(15, 45),
              )
              response.raise_for_status()
              data = response.json()
              return [e for e in data.get("entries", []) if e.get("channelId") == channel_id]

          def times(entry):
              return (
                  datetime.fromtimestamp(int(entry["startTimestamp"]) / 1000, tz=timezone.utc),
                  datetime.fromtimestamp(int(entry["endTimestamp"]) / 1000, tz=timezone.utc),
              )

          def title(entry):
              show = entry.get("show") if isinstance(entry.get("show"), dict) else {}
              return str(show.get("originalTitle") or show.get("title") or entry.get("nameSingleLine") or entry.get("name") or "Program").strip()

          def description(entry):
              show = entry.get("show") if isinstance(entry.get("show"), dict) else {}
              return str(show.get("shortDescription") or show.get("longDescription") or entry.get("description") or "").strip()

          target = Path("guide-clean-v2.xml")
          tree = ET.parse(target)
          root = tree.getroot()

          for channel_id, cfg in CHANNELS.items():
              entries = call_epg(channel_id)
              usable = []
              for entry in entries:
                  try:
                      start, stop = times(entry)
                  except Exception:
                      continue
                  if stop > start:
                      usable.append(entry)
              if len(usable) < 5:
                  raise SystemExit(f"T-2 {cfg['display']} returned only {len(usable)} usable entries")
              latest = max(times(e)[1] for e in usable)
              if latest <= datetime.now(timezone.utc) + timedelta(hours=24):
                  raise SystemExit(f"T-2 {cfg['display']} schedule is stale: {latest.isoformat()}")

              for xmltv_id in (cfg["canonical"], cfg["alias"]):
                  for c in list(root.findall("channel")):
                      if c.get("id") == xmltv_id:
                          root.remove(c)
                  for p in list(root.findall("programme")):
                      if p.get("channel") == xmltv_id:
                          root.remove(p)

                  channel = ET.Element("channel", id=xmltv_id)
                  ET.SubElement(channel, "display-name", lang="bs").text = cfg["display"]
                  ET.SubElement(channel, "icon", src=cfg["logo"])
                  root.insert(len(root.findall("channel")), channel)

                  count = 0
                  for entry in sorted(usable, key=lambda e: int(e["startTimestamp"])):
                      start, stop = times(entry)
                      programme = ET.SubElement(
                          root,
                          "programme",
                          channel=xmltv_id,
                          start=start.strftime("%Y%m%d%H%M%S %z"),
                          stop=stop.strftime("%Y%m%d%H%M%S %z"),
                      )
                      ET.SubElement(programme, "title", lang="bs").text = title(entry)
                      desc = description(entry)
                      if desc:
                          ET.SubElement(programme, "desc", lang="bs").text = desc
                      count += 1

                  print(f"{xmltv_id}: programmes={count}, through={latest.isoformat()}, logo={cfg['logo']}")

          tree.write(target, encoding="utf-8", xml_declaration=True)
          PY

      - name: Commit refreshed guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-clean-v2.xml
          if git diff --cached --quiet; then
            echo "No guide change"
          else
            git commit -m "Refresh Hayat Stil and Love Box from T-2"
            git push
          fi
