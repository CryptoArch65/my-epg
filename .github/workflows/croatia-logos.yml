name: Update Croatia Logos

on:
  workflow_run:
    workflows: ["Update Informer TV MTS EPG"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: guide-writer
  cancel-in-progress: false

jobs:
  update-croatia-logos:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Replace Croatia guide logos from M3U
        run: python3 scripts/host_m3u_croatia_logos.py config/m3u-croatia-logo-trial.csv config/bih-source-logos.csv logos

      - name: Add Croatia playlist EPG aliases
        run: python3 scripts/add_croatia_playlist_aliases.py guide.xml config/croatia-playlist-aliases.csv

      - name: Apply Croatia logos to playlist tvg-id channels
        run: python3 scripts/apply_m3u_croatia_playlist_logos.py guide.xml config/m3u-croatia-playlist-logos.csv logos

      - name: Commit Croatia logo and EPG alias updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml config/bih-source-logos.csv logos/
          if git diff --cached --quiet; then
            echo "Croatia logos and aliases have not changed"
            exit 0
          fi
          git commit -m "Update Croatia logos and EPG aliases"
          git push
