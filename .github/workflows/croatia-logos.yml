name: Update Croatia Logos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - guide.xml
      - config/m3u-croatia-logo-trial.csv
      - config/m3u-croatia-playlist-logos.csv
      - config/croatia-playlist-aliases.csv
      - scripts/host_m3u_croatia_logos.py
      - scripts/apply_m3u_croatia_playlist_logos.py
      - scripts/add_croatia_playlist_aliases.py
      - .github/workflows/croatia-logos.yml

permissions:
  contents: write

concurrency:
  group: croatia-logo-refresh
  cancel-in-progress: false

jobs:
  update-croatia-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Replace Croatia guide logos from M3U
        run: python3 scripts/host_m3u_croatia_logos.py config/m3u-croatia-logo-trial.csv config/bih-source-logos.csv logos

      - name: Add Croatia playlist EPG aliases
        run: python3 scripts/add_croatia_playlist_aliases.py guide.xml config/croatia-playlist-aliases.csv

      - name: Apply Croatia logos to playlist tvg-id channels
        run: python3 scripts/apply_m3u_croatia_playlist_logos.py guide.xml config/m3u-croatia-playlist-logos.csv logos

      - name: Commit Croatia logo and EPG alias updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BACKUP_DIR=$(mktemp -d)
          cp guide.xml "$BACKUP_DIR/guide.xml"
          [ -f config/bih-source-logos.csv ] && cp config/bih-source-logos.csv "$BACKUP_DIR/bih-source-logos.csv"
          [ -d logos ] && cp -r logos "$BACKUP_DIR/logos"

          pushed=0
          for attempt in $(seq 1 5); do
            echo "Publish attempt $attempt of 5..."
            git fetch origin main
            git reset --hard origin/main
            cp "$BACKUP_DIR/guide.xml" guide.xml
            [ -f "$BACKUP_DIR/bih-source-logos.csv" ] && cp "$BACKUP_DIR/bih-source-logos.csv" config/bih-source-logos.csv
            [ -d "$BACKUP_DIR/logos" ] && cp -r "$BACKUP_DIR/logos/." logos/
            git add guide.xml config/bih-source-logos.csv logos/
            if git diff --cached --quiet; then
              echo "Croatia logos and aliases have not changed"
              pushed=1
              break
            fi
            git commit -m "Update Croatia logos and EPG aliases"
            if git push origin HEAD:main; then
              echo "Successfully pushed Croatia logos and EPG aliases"
              pushed=1
              break
            fi
            echo "Push rejected (concurrent push to main), retrying in 3s..."
            sleep 3
          done
          rm -rf "$BACKUP_DIR"
          if [ "$pushed" -ne 1 ]; then
            echo "Failed to push Croatia logos and aliases after 5 attempts" >&2
            exit 1
          fi
