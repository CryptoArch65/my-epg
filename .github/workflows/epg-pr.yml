name: Test selected EPG

on:
  pull_request:
    branches: [main]
    paths:
      - config/channels.xml
      - config/playlist_aliases.csv
      - config/bih-source-logos.csv
      - scripts/add_channel_logos.py
      - scripts/add_playlist_aliases.py
      - scripts/validate_guide.py
      - .github/workflows/epg.yml
      - .github/workflows/epg-pr.yml

permissions:
  contents: read

jobs:
  test-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Install project-specific grabber configs
        run: |
          mkdir -p epg/sites/naslovi.net
          cp scripts/naslovi.net.config.js epg/sites/naslovi.net/naslovi.net.config.js
          cp scripts/arena_serbia.config.js epg/sites/tvarenasport.com/tvarenasport.com.config.js
          python3 - <<'PY'
          from pathlib import Path
          config = Path("epg/sites/tvarenasport.hr/tvarenasport.hr.config.js")
          original = "url: 'https://tvarenaprogram.com/live/v2/hr',"
          replacement = "url: 'https://tvarenasport.hr/wp-content/tv-program.php',"
          content = config.read_text(encoding="utf-8")
          if content.count(original) != 1:
              raise SystemExit("Croatian Arena grabber URL changed upstream")
          config.write_text(content.replace(original, replacement), encoding="utf-8")
          PY

      - name: Install grabber dependencies
        working-directory: epg
        run: npm ci

      - name: Grab selected channels
        working-directory: epg
        run: |
          npm run grab --- \
            --channels=../config/channels.xml \
            --output=../guide.new.xml \
            --maxConnections=4

      - name: Validate proposed guide
        run: |
          python3 scripts/add_channel_logos.py guide.new.xml config/bih-source-logos.csv
          python3 scripts/add_playlist_aliases.py guide.new.xml config/playlist_aliases.csv
          python3 scripts/validate_guide.py config/channels.xml guide.new.xml config/playlist_aliases.csv
