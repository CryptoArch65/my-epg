name: Test selected EPG

on:
  pull_request:
    branches: [main]
    paths:
      - config/channels.xml
      - config/playlist_aliases.csv
      - config/bih-source-logos.csv
      - scripts/add_channel_logos.py
      - scripts/add_playlist_aliases.py
      - scripts/validate_guide.py
      - .github/workflows/epg.yml
      - .github/workflows/epg-pr.yml

permissions:
  contents: read

jobs:
  test-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone iptv-org/epg
        # Pinned to a known-good commit of iptv-org/epg to prevent upstream breaking changes.
        # Commit: a047034a86e37ac4ed88adaceecf5df196165a46 (master branch as of 2026-10-01)
        # TODO: update this pin periodically (see docs/GRABBER_PINNING.md)
        run: |
          git init epg
          cd epg
          git remote add origin https://github.com/iptv-org/epg.git
          git fetch --depth 1 origin a047034a86e37ac4ed88adaceecf5df196165a46
          git checkout FETCH_HEAD

      - name: Install grabber dependencies
        working-directory: epg
        run: npm ci

      - name: Grab selected channels
        working-directory: epg
        run: |
          npm run grab --- \
            --channels=../config/channels.xml \
            --output=../guide.new.xml \
            --maxConnections=4

      - name: Validate proposed guide
        run: |
          python3 scripts/add_channel_logos.py guide.new.xml config/bih-source-logos.csv
          python3 scripts/add_playlist_aliases.py guide.new.xml config/playlist_aliases.csv
          python3 scripts/validate_guide.py config/channels.xml guide.new.xml config/playlist_aliases.csv
