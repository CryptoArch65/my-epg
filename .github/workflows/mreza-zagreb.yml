name: Update custom channel fixes

on:
  workflow_run:
    workflows: ["Update EPG Extras"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import_gledaj_mreza_zagreb.py
      - scripts/import_requested_channels.py
      - scripts/import_mts_pink3_narodna.py
      - scripts/import_mts_superstar.py
      - scripts/import_mts_foodnetwork.py
      - scripts/import_zdrava_tvprogramdanas.py
      - scripts/import_cinemania_telemach.py
      - scripts/apply_mreza_source_logo.py
      - .github/workflows/mreza-zagreb.yml
  schedule:
    - cron: "40 5 * * *"

permissions:
  contents: write

concurrency:
  group: guide-writer
  cancel-in-progress: false

jobs:
  update-custom-channels:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout latest published guide
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser and browser dependencies
        run: |
          python -m pip install lxml playwright
          python -m playwright install --with-deps chromium

      - name: Import Mreza Zagreb from Gledaj.hr
        run: |
          python3 scripts/import_gledaj_mreza_zagreb.py guide.xml
          python3 scripts/apply_mreza_source_logo.py guide.xml

      - name: Import requested EPG and logo fixes
        run: |
          python3 scripts/import_requested_channels.py guide.xml
          python3 scripts/import_mts_pink3_narodna.py guide.xml
          python3 scripts/import_mts_superstar.py guide.xml
          python3 scripts/import_mts_foodnetwork.py guide.xml
          python3 scripts/import_zdrava_tvprogramdanas.py guide.xml
          python3 scripts/import_cinemania_telemach.py guide.xml

      - name: Verify requested channels
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          root = ET.parse('guide.xml').getroot()
          counts = Counter(p.get('channel') for p in root.findall('programme'))
          required_epg = (
              'MrezaZG.hr', 'NisTV.rs', 'OsječkaTV.hr', 'pink2.rs', 'OTV.hr',
              'vesti.rs', 'narodnatv.rs', 'CinemaniaHD.ba',
              'SuperstarTV1.rs', 'SuperstarTV2.rs', 'SuperstarTV3.rs',
              '343758888241', 'zdravatv.hr'
          )
          inspected = (
              'MrezaZG.hr','NisTV.rs','OsječkaTV.hr','htv5','pink2.rs','OTV.hr',
              'RTVMlava.rs','RTL.hr','vesti.rs','narodnatv.rs','CinemaniaHD.ba',
              'SuperstarTV1.rs','SuperstarTV2.rs','SuperstarTV3.rs',
              'iptv#ch-451-food-network','foodnetwork.ba','343758888241','zdravatv.hr'
          )
          for cid in inspected:
              ch = next((c for c in root.findall('channel') if c.get('id') == cid), None)
              names = [(n.text or '').strip() for n in ch.findall('display-name')] if ch is not None else []
              icon = ch.find('icon') if ch is not None else None
              print(cid, 'programmes=', counts[cid], 'logo=', bool(icon is not None and icon.get('src')), 'names=', names)
          for cid in required_epg:
              if counts[cid] == 0:
                  raise SystemExit(f'{cid} has no programmes')
          for cid in ('vesti.rs','narodnatv.rs','CinemaniaHD.ba','343758888241','zdravatv.hr'):
              ch = next((c for c in root.findall('channel') if c.get('id') == cid), None)
              if ch is None or ch.find('icon') is None or not ch.find('icon').get('src'):
                  raise SystemExit(f'{cid} source logo missing')
          mlava = next((c for c in root.findall('channel') if c.get('id') == 'RTVMlava.rs'), None)
          if mlava is None or mlava.find('icon') is None or not mlava.find('icon').get('src'):
              raise SystemExit('RTVMlava.rs logo missing')
          if counts['htv5'] == 0:
              print('WARNING: HRT INT TVEpg source unavailable on this run')
          if counts['iptv#ch-451-food-network'] == 0:
              print('WARNING: Food Network source exists but currently has no live programme data')
          PY

      - name: Publish guide.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+CryptoArch65@users.noreply.github.com"
          git add guide.xml
          if git diff --cached --quiet; then
            echo "Guide has not changed"
            exit 0
          fi
          git commit -m "Update requested channel EPG and logos"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
