name: Diagnose MTS Music Candidates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-mts-music.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Search live MTS v2 channel catalogue
        run: |
          python3 - <<'PY'
          import json, re, unicodedata
          from datetime import datetime
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          def norm(v):
              v = unicodedata.normalize('NFKD', str(v or '')).encode('ascii','ignore').decode('ascii').lower()
              return re.sub(r'[^a-z0-9]+',' ',v).strip()

          day = datetime.now(ZoneInfo('Europe/Belgrade')).date().isoformat()
          api = 'https://mts.rs/hybris/mtscommercewebservices/v2/mtsB2C/products/search'
          query = f':pozicija-rastuce:tv-kategorija:iris-tv-paketi:channelProgramDates:{day}'
          def page(n):
              url = api + '?' + urlencode({'sort':'pozicija-rastuce','searchQueryContext':'CHANNEL_PROGRAM','query':query,'pageSize':50,'fields':'FULL','currentPage':n})
              req = Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'application/json, text/plain, */*'})
              with urlopen(req, timeout=40) as r: return json.load(r)
          first = page(0)
          pages = first['pagination']['totalPages']
          products = list(first.get('products') or [])
          for n in range(1,pages): products.extend(page(n).get('products') or [])

          needles = ['yu planet','kafanska','play tv','imperia','sehara','etno','jagodina','uzivoteka','top tv','roma tv','kafansko','toxic folk','toxic rap']
          print('Products:', len(products))
          for p in products:
              hay = norm((p.get('name') or '') + ' ' + (p.get('code') or ''))
              hits = [x for x in needles if x in hay]
              if hits:
                  print('MATCH', hits, 'code=', repr(p.get('code')), 'name=', repr(p.get('name')), 'programs=', len(p.get('programs') or []), 'position=', repr(p.get('channelPosition')))
          PY
