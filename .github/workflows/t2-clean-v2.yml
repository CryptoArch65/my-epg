name: Refresh T-2 channels in clean-v2 guide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/t2-clean-v2.yml"
  schedule:
    - cron: "47 3,15 * * *"

permissions:
  contents: write

concurrency:
  group: t2-clean-v2-guide
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Refresh reviewed T-2 channels
        run: |
          python - <<'PY'
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import requests

          BASE = "https://player-stage.t-2.net/"
          VERSION = "11.10"
          CLIENT_ID = "7180361494733769941"
          PUBLIC_KEY = "307b2976-aa5f-4664-837e-74a4c91d5de8"
          PREFIX = f"Catherine/api/{VERSION}/json/{CLIENT_ID}/"
          SIGNING = PUBLIC_KEY + VERSION + "json" + CLIENT_ID

          CHANNELS = {
              1000913: {
                  "ids": ["HayatZivotIStil.ba", "hayatživotistil.ba"],
                  "display": "|BIH| HAYAT STIL ZIVOT",
                  "logo": BASE + "static/media/img/channels/dark/medium/4800648.png",
              },
              1000918: {
                  "ids": ["HayatLoveBox.ba", "hayatlovebox.ba"],
                  "display": "|BIH| HAYAT LOVE BOX",
                  "logo": BASE + "static/media/img/channels/dark/medium/4820306.png",
              },
              1000813: {
                  "ids": ["ducktv.hr"],
                  "display": "DUCK TV",
                  "logo": BASE + "static/media/img/channels/dark/medium/3656096.png",
              },
          }

          def call_epg(channel_id):
              now = datetime.now(timezone.utc)
              start = datetime(now.year, now.month, now.day, tzinfo=timezone.utc) - timedelta(hours=2)
              end = start + timedelta(days=4)
              action = "client/tv/getEpg"
              payload = {
                  "locale": "en-GB",
                  "returnDummyEpg": True,
                  "channelId": [channel_id],
                  "startTime": int(start.timestamp() * 1000),
                  "endTime": int(end.timestamp() * 1000),
                  "imageInfo": [{"height": 360, "width": 640}],
                  "includeBookmarks": True,
                  "includeShow": True,
                  "includeProfileContentId": True,
              }
              body = json.dumps(payload, separators=(",", ":"), ensure_ascii=False)
              signature = hashlib.md5((SIGNING + action + body).encode("utf-8")).hexdigest()
              response = requests.post(
                  f"{BASE}{PREFIX}{signature}/{action}",
                  data=body.encode("utf-8"),
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
                  timeout=(15, 45),
              )
              response.raise_for_status()
              data = response.json()
              return [
                  row for row in data.get("entries", [])
                  if isinstance(row, dict) and row.get("channelId") == channel_id
              ]

          def event_times(row):
              return (
                  datetime.fromtimestamp(int(row["startTimestamp"]) / 1000, tz=timezone.utc),
                  datetime.fromtimestamp(int(row["endTimestamp"]) / 1000, tz=timezone.utc),
              )

          def title(row):
              show = row.get("show") if isinstance(row.get("show"), dict) else {}
              return str(
                  show.get("originalTitle")
                  or show.get("title")
                  or row.get("nameSingleLine")
                  or row.get("name")
                  or "Program"
              ).strip()

          def description(row):
              show = row.get("show") if isinstance(row.get("show"), dict) else {}
              return str(
                  show.get("shortDescription")
                  or show.get("longDescription")
                  or row.get("description")
                  or ""
              ).strip()

          target = Path("guide-clean-v2.xml")
          tree = ET.parse(target)
          root = tree.getroot()
          changed = False

          for channel_id, cfg in CHANNELS.items():
              try:
                  entries = call_epg(channel_id)
              except Exception as exc:
                  print(f"WARNING T-2 {cfg['display']}: {type(exc).__name__}: {exc}; preserving existing data")
                  continue

              usable = []
              for row in entries:
                  try:
                      start, stop = event_times(row)
                  except (KeyError, TypeError, ValueError):
                      continue
                  if stop > start:
                      usable.append(row)

              if len(usable) < 5:
                  print(f"WARNING T-2 {cfg['display']}: only {len(usable)} usable entries; preserving existing data")
                  continue

              latest = max(event_times(row)[1] for row in usable)
              if latest <= datetime.now(timezone.utc) + timedelta(hours=24):
                  print(f"WARNING T-2 {cfg['display']}: stale through {latest.isoformat()}; preserving existing data")
                  continue

              for xmltv_id in cfg["ids"]:
                  for node in list(root.findall("channel")):
                      if node.get("id") == xmltv_id:
                          root.remove(node)
                  for node in list(root.findall("programme")):
                      if node.get("channel") == xmltv_id:
                          root.remove(node)

                  channel = ET.Element("channel", id=xmltv_id)
                  ET.SubElement(channel, "display-name", lang="bs").text = cfg["display"]
                  ET.SubElement(channel, "icon", src=cfg["logo"])
                  root.insert(len(root.findall("channel")), channel)

                  count = 0
                  for row in sorted(usable, key=lambda r: int(r.get("startTimestamp", 0))):
                      start, stop = event_times(row)
                      programme = ET.SubElement(
                          root,
                          "programme",
                          channel=xmltv_id,
                          start=start.strftime("%Y%m%d%H%M%S %z"),
                          stop=stop.strftime("%Y%m%d%H%M%S %z"),
                      )
                      ET.SubElement(programme, "title", lang="bs").text = title(row)
                      desc = description(row)
                      if desc:
                          ET.SubElement(programme, "desc", lang="bs").text = desc
                      show = row.get("show") if isinstance(row.get("show"), dict) else {}
                      category = show.get("category") if isinstance(show.get("category"), dict) else {}
                      category_name = str(category.get("name") or "").strip()
                      if category_name:
                          ET.SubElement(programme, "category", lang="en").text = category_name
                      count += 1

                  print(
                      f"T-2 {cfg['display']} / {xmltv_id}: programmes={count}, "
                      f"through={latest.isoformat()}, logo={cfg['logo']}"
                  )
              changed = True

          if changed:
              tree.write(target, encoding="utf-8", xml_declaration=True)
          else:
              print("No healthy T-2 channel updates; guide left unchanged")
          PY

      - name: Commit refreshed clean-v2 guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-clean-v2.xml
          if git diff --cached --quiet; then
            echo "No guide change"
          else
            git commit -m "Refresh clean-v2 T-2 EPG"
            git push
          fi
