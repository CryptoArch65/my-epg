name: Update EPG Extras

on:
  workflow_run:
    workflows: ["Update EPG"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - scripts/diagnose_mts_regional_times.py
      - scripts/import_mts_serbia_epg.py
      - scripts/import_mts_pink_epg.py
      - scripts/run_epg_extras.sh
      - config/serbia-extra-mts.xml
      - config/serbia-extra-telemach.xml
      - .github/workflows/epg-extras.yml

permissions:
  contents: write

concurrency:
  group: guide-writer
  cancel-in-progress: false

jobs:
  update-extras:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest published guide
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose live MTS regional timestamps
        run: python3 scripts/diagnose_mts_regional_times.py

      - name: Run all EPG extras serially
        run: bash scripts/run_epg_extras.sh
