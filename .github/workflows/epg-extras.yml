name: Update EPG Extras

on:
  workflow_run:
    workflows: ["Update EPG"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: guide-writer
  cancel-in-progress: false

jobs:
  update-extras:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest published guide
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run all EPG extras serially
        run: bash scripts/run_epg_extras.sh
