name: Update EPG Extras

on:
  workflow_run:
    workflows: ["Update EPG"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - scripts/diagnose_mts_regional_times.py
      - scripts/diagnose_xmltv_duplicates.py
      - scripts/apply_mts_regional_fix.py
      - scripts/verify_mts_regional_guide.py
      - scripts/import_mts_serbia_epg.py
      - scripts/fix_mts_regional_identity.py
      - scripts/remove_duplicate_regional_aliases.py
      - scripts/import_nova_series_logo.py
      - scripts/import_pikaboo_telemach.py
      - scripts/import_kids_telemach.py
      - scripts/run_epg_extras.sh
      - config/serbia-extra-mts.xml
      - config/serbia-extra-telemach.xml
      - config/croatia-extra-channels.xml
      - .github/workflows/epg-extras.yml

permissions:
  contents: write

concurrency:
  group: guide-writer
  cancel-in-progress: false

jobs:
  update-extras:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest published guide
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose live MTS regional timestamps
        run: python3 scripts/diagnose_mts_regional_times.py

      - name: Apply MTS regional local-clock fix
        run: |
          python3 scripts/apply_mts_regional_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/import_mts_serbia_epg.py
          if ! git diff --cached --quiet; then
            git commit -m "Fix MTS regional clock and Newsmax alias"
          fi

      - name: Run all EPG extras serially
        run: bash scripts/run_epg_extras.sh

      - name: Replace all MTS schedules with live v2 website feed
        run: |
          python3 scripts/import_mts_v2_all.py guide.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update all MTS schedules from v2 feed"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Restore Telemach kids schedules and logos
        run: |
          python3 scripts/import_kids_telemach.py \
            guide.xml epg/sites/epg.telemach.ba/epg.telemach.ba.config.js logos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml logos/
          if ! git diff --cached --quiet; then
            git commit -m "Restore Telemach kids schedules and logos"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Fix RTV Kraljevo, regional logos, and duplicate aliases
        run: |
          python3 scripts/fix_mts_regional_identity.py guide.xml
          python3 scripts/remove_duplicate_regional_aliases.py guide.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml logos/
          if ! git diff --cached --quiet; then
            git commit -m "Fix RTV Kraljevo, regional logos, and duplicate aliases"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Diagnose remaining XMLTV duplicate choices
        run: python3 scripts/diagnose_xmltv_duplicates.py guide.xml config/playlist_aliases.csv

      - name: Verify final Serbian regional guide
        run: python3 scripts/verify_mts_regional_guide.py guide.xml
