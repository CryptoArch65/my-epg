name: Import clean-v2 run 31 guide

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-clean-v2-run31.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-eff4-820b-bdab-f4533e512b62/raw?se=2026-10-05T10%3A06%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=38207cbd-354c-5471-b83a-a9d73cf46997&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T01%3A30%3A49Z&ske=2026-10-06T01%3A30%3A49Z&sks=b&skv=2026-02-06&sig=0tRvxB7SKCaF6P3TwktY4hjtJC8ru500T/enfzL/%2BRg%3D"
      EXPECTED_SHA256: "3e280c6aee6f79273a83c10fe351eb49173ff5eaffe76b393704f4a031508527"
    steps:
      - uses: actions/checkout@v4

      - name: Download exact run 31 guide artifact
        run: |
          curl -L --fail --retry 2 "$ARTIFACT_URL" -o /tmp/run31-guide.zip
          rm -rf /tmp/run31-guide
          mkdir -p /tmp/run31-guide
          unzip -q /tmp/run31-guide.zip -d /tmp/run31-guide
          test -s /tmp/run31-guide/guide.xml
          echo "$EXPECTED_SHA256  /tmp/run31-guide/guide.xml" | sha256sum -c -

      - name: Publish as guide-clean-v2.xml
        run: |
          cp /tmp/run31-guide/guide.xml guide-clean-v2.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-clean-v2.xml
          if git diff --cached --quiet; then
            echo "guide-clean-v2.xml already matches run 31"
          else
            git commit -m "Publish clean-v2 guide from run 31"
            git push
          fi
