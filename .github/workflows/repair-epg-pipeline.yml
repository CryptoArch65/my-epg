name: Repair EPG Writer Pipeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-epg-pipeline.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Serialize all guide.xml writers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_on_block(path: Path, upstream: str):
              text = path.read_text(encoding='utf-8')
              marker = '\npermissions:\n'
              if not text.startswith('name:') or '\non:\n' not in text or marker not in text:
                  raise SystemExit(f'Unexpected workflow structure: {path}')
              prefix, rest = text.split('\non:\n', 1)
              _, suffix = rest.split(marker, 1)
              new_on = (
                  'on:\n'
                  '  workflow_run:\n'
                  f'    workflows: ["{upstream}"]\n'
                  '    types: [completed]\n'
              )
              return prefix + '\n' + new_on + marker + suffix

          def set_concurrency(text: str, cancel: bool):
              pattern = re.compile(
                  r'concurrency:\n  group: [^\n]+\n  cancel-in-progress: (?:true|false)'
              )
              replacement = (
                  'concurrency:\n'
                  '  group: guide-writer\n'
                  f'  cancel-in-progress: {str(cancel).lower()}'
              )
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('Could not update concurrency block')
              return text

          def set_job_condition(text: str, condition: str):
              jobs_offset = text.index('jobs:')
              pattern = re.compile(r'(?m)^(  [A-Za-z0-9_-]+:)\n(?:    if: .*\n)?')
              match = pattern.search(text[jobs_offset:])
              if not match:
                  raise SystemExit('Could not locate workflow job')
              start = jobs_offset + match.start()
              end = jobs_offset + match.end()
              return text[:start] + match.group(1) + '\n    if: ' + condition + '\n' + text[end:]

          def gh_expr(body: str):
              return '$' + '{{ ' + body + ' }}'

          main = root / '.github/workflows/epg.yml'
          text = main.read_text(encoding='utf-8')
          text = set_concurrency(text, True)
          text = text.replace('      - config/bih-source-logos.csv\n', '')

          anchor = '      - .github/workflows/epg.yml\n'
          if anchor not in text:
              raise SystemExit('Could not locate Update EPG path trigger anchor')
          extra_paths = ''.join([
              '      - config/serbia-extra-mts.xml\n',
              '      - config/serbia-extra-mts-logos.csv\n',
              '      - config/croatia-extra-channels.xml\n',
              '      - config/croatia-playlist-aliases.csv\n',
              '      - config/m3u-croatia-playlist-logos.csv\n',
              '      - config/hype-mts.xml\n',
              '      - config/informer-mts.xml\n',
              '      - config/m3u-croatia-logo-trial.csv\n',
              '      - scripts/import_mts_pink_hahalol.py\n',
              '      - scripts/merge_xmltv.py\n',
              '      - scripts/add_croatia_epg_aliases.py\n',
              '      - scripts/apply_m3u_croatia_playlist_logos.py\n',
              '      - scripts/import_nova_cinema_raspored.py\n',
              '      - scripts/import_nova_family_tvprogramdanas.py\n',
              '      - scripts/import_nova_world_tvepg.py\n',
              '      - scripts/import_bih_local_channels.py\n',
              '      - scripts/host_m3u_croatia_logos.py\n',
              '      - scripts/add_croatia_playlist_aliases.py\n',
              '      - .github/workflows/serbia-extra-mts.yml\n',
              '      - .github/workflows/croatia-extra-epg.yml\n',
              '      - .github/workflows/hype-mts.yml\n',
              '      - .github/workflows/informer-mts.yml\n',
              '      - .github/workflows/croatia-logos.yml\n',
              '      - .github/workflows/bih-local-epg.yml\n',
          ])
          if '      - config/serbia-extra-mts.xml\n' not in text:
              text = text.replace(anchor, anchor + extra_paths)
          main.write_text(text, encoding='utf-8')

          success_only = gh_expr("github.event.workflow_run.conclusion == 'success'")
          success_or_failure = gh_expr(
              "github.event.workflow_run.conclusion == 'success' || "
              "github.event.workflow_run.conclusion == 'failure'"
          )
          chain = [
              ('.github/workflows/serbia-extra-mts.yml', 'Update EPG', success_only),
              ('.github/workflows/croatia-extra-epg.yml', 'Update Serbia Extra MTS EPG', success_or_failure),
              ('.github/workflows/hype-mts.yml', 'Update Croatia Extra EPG', success_or_failure),
              ('.github/workflows/informer-mts.yml', 'Update Hype TV MTS EPG', success_or_failure),
              ('.github/workflows/croatia-logos.yml', 'Update Informer TV MTS EPG', success_or_failure),
              ('.github/workflows/bih-local-epg.yml', 'Update Croatia Logos', success_or_failure),
          ]

          for rel, upstream, condition in chain:
              path = root / rel
              workflow = replace_on_block(path, upstream)
              workflow = set_concurrency(workflow, False)
              workflow = set_job_condition(workflow, condition)
              path.write_text(workflow, encoding='utf-8')
              print(f'Updated {rel}: after {upstream}')
          PY

      - name: Upload repaired workflow files
        uses: actions/upload-artifact@v4
        with:
          name: serialized-epg-workflows
          path: |
            .github/workflows/epg.yml
            .github/workflows/serbia-extra-mts.yml
            .github/workflows/croatia-extra-epg.yml
            .github/workflows/hype-mts.yml
            .github/workflows/informer-mts.yml
            .github/workflows/croatia-logos.yml
            .github/workflows/bih-local-epg.yml
          if-no-files-found: error
