name: Diagnose Gledaj Mreza EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gledaj-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect player scripts for EPG API
        run: |
          python3 - <<'PY'
          import re
          from urllib.request import Request, urlopen

          base = 'https://player.gledaj.hr/'
          assets = [
              'perception_player-11.7.6/scripts/perception.min.js',
              'perception_player-11.7.6/scripts/perception-lib.min.js',
          ]
          headers = {'User-Agent': 'Mozilla/5.0', 'Referer': base}
          for asset in assets:
              url = base + asset
              print('\nASSET', url)
              with urlopen(Request(url, headers=headers), timeout=60) as r:
                  text = r.read(8_000_000).decode('utf-8', errors='replace')
              print('bytes/chars:', len(text))
              for needle in ('/epg/', 'epg/', 'api/', '/api/', 'channelProgram', 'getEpg', 'EPG'):
                  print('\nNEEDLE', needle)
                  seen = 0
                  for m in re.finditer(re.escape(needle), text, flags=re.I):
                      start = max(0, m.start() - 500)
                      end = min(len(text), m.end() + 1000)
                      snippet = text[start:end].replace('\n', ' ')
                      print(snippet)
                      seen += 1
                      if seen >= 8:
                          break
                  print('shown:', seen)
              urls = sorted(set(re.findall(r'https?://[^"\'\\\s]+', text)))
              print('\nURLS')
              for u in urls[:200]:
                  print(u[:1000])
          PY
