name: Diagnose Gledaj Mreza EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gledaj-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Capture Gledaj.hr EPG API calls
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          now = datetime.now(ZoneInfo('Europe/Zagreb'))
          midnight = now.replace(hour=0, minute=0, second=0, microsecond=0)
          millis = int(midnight.timestamp() * 1000)
          url = f'https://player.gledaj.hr/tv/epg/299/time/{millis}'
          print('PAGE:', url)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              def on_request(req):
                  u = req.url
                  if 'Catherine/api/' in u or 'getEpg' in u or '/api/' in u:
                      print('\nREQUEST', req.method, u)
                      print('POSTDATA', req.post_data or '')

              def on_response(resp):
                  u = resp.url
                  if 'Catherine/api/' in u or 'getEpg' in u or '/api/' in u:
                      print('\nRESPONSE', resp.status, u)
                      try:
                          body = resp.text()
                      except Exception as exc:
                          print('BODY-ERROR', repr(exc))
                          return
                      print('BODY', body[:50000])

              page.on('request', on_request)
              page.on('response', on_response)
              page.goto(url, wait_until='domcontentloaded', timeout=60000)
              page.wait_for_timeout(20000)
              print('TITLE:', page.title())
              print('BODYTEXT:', page.locator('body').inner_text()[:20000])
              browser.close()
          PY
