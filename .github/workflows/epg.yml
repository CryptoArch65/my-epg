name: Update EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/channels.xml
      - config/playlist_aliases.csv
      - config/bih-source-logos.csv
      - scripts/add_channel_logos.py
      - scripts/add_playlist_aliases.py
      - scripts/validate_guide.py
      - .github/workflows/epg.yml
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: epg-refresh
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Install grabber dependencies
        working-directory: epg
        run: npm ci

      - name: Grab selected channels
        working-directory: epg
        run: |
          npm run grab --- \
            --channels=../config/channels.xml \
            --output=../guide.new.xml \
            --maxConnections=4

      - name: Validate guide before publishing
        run: |
          python3 scripts/add_channel_logos.py guide.new.xml config/bih-source-logos.csv
          python3 scripts/add_playlist_aliases.py guide.new.xml config/playlist_aliases.csv
          python3 scripts/validate_guide.py config/channels.xml guide.new.xml config/playlist_aliases.csv

      - name: Publish guide.xml
        if: github.ref == 'refs/heads/main'
        run: |
          mv guide.new.xml guide.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml
          if git diff --cached --quiet; then
            echo "Guide has not changed"
            exit 0
          fi
          git commit -m "Update EPG"
          git push

      - name: Diagnose Arena Sport EPG in published guide
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          arena_ids = [
              "ArenaSport1.ba",
              "ArenaSport2.ba",
              "ArenaSport3.ba",
              "ArenaSport4.ba",
              "ArenaSport5BH.ba",
              "ArenaSport6.ba",
          ]

          root = ET.parse("guide.xml").getroot()

          print("=== Arena Sport EPG diagnostics ===")
          for channel_id in arena_ids:
              programmes = [
                  p for p in root.findall("programme")
                  if p.get("channel") == channel_id
              ]

              programmes.sort(key=lambda p: p.get("start", ""))

              print(f"\\n{channel_id}")
              print(f"  Programme count: {len(programmes)}")

              if not programmes:
                  print("  FIRST: NONE")
                  print("  LAST:  NONE")
                  continue

              def describe(programme):
                  title = programme.find("title")
                  title_text = " ".join(title.itertext()).strip() if title is not None else "(no title)"
                  return f"{programme.get('start', '?')} -> {programme.get('stop', '?')} | {title_text}"

              print(f"  FIRST: {describe(programmes[0])}")
              print(f"  LAST:  {describe(programmes[-1])}")

          print("\\n=== End Arena Sport EPG diagnostics ===")
          PY
