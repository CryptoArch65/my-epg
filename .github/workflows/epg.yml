name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: epg-refresh
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Install grabber dependencies
        working-directory: epg
        run: npm ci

      - name: Grab selected channels
        working-directory: epg
        run: |
          npm run grab --- \
            --channels=../config/channels.xml \
            --output=../guide.new.xml \
            --maxConnections=4

      - name: Validate guide before publishing
        run: python3 scripts/validate_guide.py config/channels.xml guide.new.xml

      - name: Publish guide.xml
        if: github.ref == 'refs/heads/main'
        run: |
          mv guide.new.xml guide.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml
          if git diff --cached --quiet; then
            echo "Guide has not changed"
            exit 0
          fi
          git commit -m "Update EPG"
          git push
