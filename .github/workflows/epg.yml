name: Update EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone iptv-org/epg
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Install dependencies
        working-directory: epg
        run: npm install

      - name: Create guides directory
        run: |
          mkdir -p guides

      - name: Generate Telemach EPG
        working-directory: epg
        run: |
          npm run grab --- \
            --sites=epg.telemach.ba \
            --output=../guides/epg.telemach.ba.xml

      - name: Generate Hrvatski Telekom EPG
        working-directory: epg
        run: |
          npm run grab --- \
            --sites=maxtv.hrvatskitelekom.hr \
            --output=../guides/maxtv.hrvatskitelekom.hr.xml

      - name: Generate m:tel EPG
        working-directory: epg
        run: |
          npm run grab --- \
            --sites=mtel.ba \
            --output=../guides/mtel.ba.xml

      - name: Generate mts EPG
        working-directory: epg
        run: |
          npm run grab --- \
            --sites=mts.rs \
            --output=../guides/mts.rs.xml

      - name: Generate Arena Sport EPG
        working-directory: epg
        run: |
          npm run grab --- \
            --sites=tvarenasport.com \
            --output=../guides/tvarenasport.com.xml

      - name: Generate Arena Sport HR EPG
        working-directory: epg
        run: |
          npm run grab --- \
            --sites=tvarenasport.hr \
            --output=../guides/tvarenasport.hr.xml

      - name: Normalize and merge EPG
        run: |
          python3 scripts/normalize_epg.py

      - name: Add standard iptv-org logos
        run: |
          python3 scripts/add_logos.py

      - name: Commit guide.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add guide.xml

          git commit -m "Update EPG" || echo "No changes"

          git push
