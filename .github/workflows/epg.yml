name: Update EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/channels.xml
      - config/film-channels.xml
      - config/regional-channels.xml
      - config/playlist_aliases.csv
      - config/playlist-alias-logos.csv
      - config/bih-source-logos.csv
      - scripts/arena_serbia.config.js
      - scripts/naslovi.net.config.js
      - scripts/add_channel_logos.py
      - scripts/import_documentary_logos.py
      - scripts/import_film_epg.py
      - scripts/import_regional_epg.py
      - scripts/import_maxsport_logos.py
      - scripts/import_maxtv_channel_logos.py
      - scripts/import_mts_channel_logos.py
      - scripts/import_hayat_una_logos.py
      - scripts/add_playlist_aliases.py
      - scripts/validate_guide.py
      - scripts/import_tvprofil.py
      - config/tvprofil_channels.json
      - .github/workflows/epg.yml
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: epg-refresh
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Add Naslovi.net Eurosport schedule grabber
        run: |
          mkdir -p epg/sites/naslovi.net
          cp scripts/naslovi.net.config.js epg/sites/naslovi.net/naslovi.net.config.js

      - name: Read Serbian Arena schedules embedded on the official site
        run: cp scripts/arena_serbia.config.js epg/sites/tvarenasport.com/tvarenasport.com.config.js

      - name: Use Croatia Arena schedule embedded on the official site
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path("epg/sites/tvarenasport.hr/tvarenasport.hr.config.js")
          original = "url: 'https://tvarenaprogram.com/live/v2/hr',"
          replacement = "url: 'https://tvarenasport.hr/wp-content/tv-program.php',"
          content = config.read_text(encoding="utf-8")
          if content.count(original) != 1:
              raise SystemExit("Croatian Arena grabber URL changed upstream")
          config.write_text(content.replace(original, replacement), encoding="utf-8")
          PY

      - name: Install grabber dependencies
        working-directory: epg
        run: npm ci

      - name: Install HTML parser for broadcaster schedules
        run: python3 -m pip install lxml cairosvg playwright

      - name: Install Chromium for TVProfil
        run: python3 -m playwright install --with-deps chromium

      - name: Host selected documentary channel logos from Telemach
        run: |
          python3 scripts/import_documentary_logos.py \
            epg/sites/epg.telemach.ba/epg.telemach.ba.config.js \
            config/bih-source-logos.csv logos

      - name: Host MAXSport logos from Hrvatski Telekom
        run: python3 scripts/import_maxsport_logos.py config/bih-source-logos.csv logos

      - name: Update selected channel logos from MAXtv
        run: |
          python3 scripts/import_maxtv_channel_logos.py \
            epg/sites/mojmaxtv.hrvatskitelekom.hr/mojmaxtv.hrvatskitelekom.hr.config.js \
            config/bih-source-logos.csv

      - name: Update RTS and Prva MAX/Life logos from MTS
        run: python3 scripts/import_mts_channel_logos.py config/bih-source-logos.csv

      - name: Host Hayat and UNA TV logos
        run: python3 scripts/import_hayat_una_logos.py config/bih-source-logos.csv logos

      - name: Grab selected channels
        working-directory: epg
        run: |
          npm run grab --- \
            --channels=../config/channels.xml \
            --output=../guide.new.xml \
            --maxConnections=4

      - name: Add AXN and M1 Film broadcaster schedules and logos
        run: |
          python3 scripts/import_film_epg.py \
            guide.new.xml config/film-channels.xml config/bih-source-logos.csv logos

      - name: Add regional broadcaster schedules and logos
        run: |
          python3 scripts/import_regional_epg.py \
            guide.new.xml config/regional-channels.xml config/bih-source-logos.csv logos

      - name: Add TVProfil Arena Sport 1-6 schedules
        continue-on-error: true # TVProfil may block GitHub runners; publish other sources.
        run: |
          python3 scripts/import_tvprofil.py guide.new.xml config/tvprofil_channels.json

      - name: Validate guide before publishing
        run: |
          python3 scripts/add_channel_logos.py guide.new.xml config/bih-source-logos.csv
          python3 scripts/add_playlist_aliases.py guide.new.xml config/playlist_aliases.csv config/playlist-alias-logos.csv
          python3 scripts/validate_guide.py config/channels.xml guide.new.xml config/playlist_aliases.csv config/film-channels.xml config/regional-channels.xml

      - name: Publish guide.xml
        if: github.ref == 'refs/heads/main'
        run: |
          mv guide.new.xml guide.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml config/bih-source-logos.csv logos/
          if git diff --cached --quiet; then
            echo "Guide has not changed"
            exit 0
          fi
          git commit -m "Update EPG"
          git push

      - name: Diagnose Arena Sport EPG in published guide
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          arena_ids = [
              "ArenaSport1.ba",
              "ArenaSport2.ba",
              "ArenaSport3.ba",
              "ArenaSport4.ba",
              "ArenaSport5BH.ba",
              "ArenaSport6.ba",
          ]

          root = ET.parse("guide.xml").getroot()

          print("=== Arena Sport EPG diagnostics ===")
          for channel_id in arena_ids:
              programmes = [
                  p for p in root.findall("programme")
                  if p.get("channel") == channel_id
              ]

              programmes.sort(key=lambda p: p.get("start", ""))

              print(f"\\n{channel_id}")
              print(f"  Programme count: {len(programmes)}")

              if not programmes:
                  print("  FIRST: NONE")
                  print("  LAST:  NONE")
                  continue

              def describe(programme):
                  title = programme.find("title")
                  title_text = " ".join(title.itertext()).strip() if title is not None else "(no title)"
                  return f"{programme.get('start', '?')} -> {programme.get('stop', '?')} | {title_text}"

              print(f"  FIRST: {describe(programmes[0])}")
              print(f"  LAST:  {describe(programmes[-1])}")

          print("\\n=== End Arena Sport EPG diagnostics ===")
          PY
