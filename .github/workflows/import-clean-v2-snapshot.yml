name: Import clean-v2 guide snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-clean-v2-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-0630-820b-ad26-0261027ea920/raw?se=2026-10-05T10%3A01%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=19b8842e-8721-5773-b560-a8a60689f45c&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T01%3A30%3A48Z&ske=2026-10-06T01%3A30%3A48Z&sks=b&skv=2026-02-06&sig=zDjfRCU22Gf942S2UOXtoXsHakfoEVMAn4gwdpiuvzk%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Download clean-v2 guide artifact
        run: |
          curl -L --fail --retry 2 "$ARTIFACT_URL" -o /tmp/clean-v2-guide.zip
          rm -rf /tmp/clean-v2-guide
          mkdir -p /tmp/clean-v2-guide
          unzip -q /tmp/clean-v2-guide.zip -d /tmp/clean-v2-guide
          test -s /tmp/clean-v2-guide/guide.xml
          cp /tmp/clean-v2-guide/guide.xml guide-clean-v2.xml
      - name: Publish test guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-clean-v2.xml
          if git diff --cached --quiet; then
            echo "guide-clean-v2.xml already current"
          else
            git commit -m "Update clean-v2 guide snapshot from run 32"
            git push
          fi
