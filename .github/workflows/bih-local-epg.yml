name: Update BIH Local EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import_bih_local_channels.py
      - .github/workflows/bih-local-epg.yml
  workflow_run:
    workflows: ["Update Croatia Extra EPG"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: bih-local-epg
  cancel-in-progress: false

jobs:
  update-bih-local:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install Pillow lxml

      - name: Add TV Zivinice / RTV Cazin logos and TV Podrinje EPG
        run: python3 scripts/import_bih_local_channels.py guide.xml logos

      - name: Validate BIH local channels
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter

          root = ET.parse('guide.xml').getroot()
          channels = {c.get('id'): c for c in root.findall('channel')}
          counts = Counter(p.get('channel') for p in root.findall('programme'))

          for channel_id in ('TVZivinice.ba', 'RTVCazin.ba', 'TVPodrinje.ba'):
              if channel_id not in channels:
                  raise SystemExit(f'Missing BIH local channel: {channel_id}')
              icon = channels[channel_id].find('icon')
              if icon is None or not icon.get('src'):
                  raise SystemExit(f'Missing logo for BIH local channel: {channel_id}')
              print(channel_id, 'logo:', icon.get('src'))

          if counts['TVPodrinje.ba'] < 40:
              raise SystemExit(f'TV Podrinje EPG too short: {counts["TVPodrinje.ba"]}')
          print('TVPodrinje.ba', counts['TVPodrinje.ba'], 'programmes')
          PY

      - name: Publish BIH local guide updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BACKUP_DIR=$(mktemp -d)
          cp guide.xml "$BACKUP_DIR/guide.xml"
          [ -d logos ] && cp -r logos "$BACKUP_DIR/logos"

          pushed=0
          for attempt in $(seq 1 5); do
            echo "Publish attempt $attempt of 5..."
            git fetch origin main
            git reset --hard origin/main
            cp "$BACKUP_DIR/guide.xml" guide.xml
            [ -d "$BACKUP_DIR/logos" ] && cp -r "$BACKUP_DIR/logos/." logos/
            git add guide.xml logos/
            if git diff --cached --quiet; then
              echo "BIH local EPG has not changed"
              pushed=1
              break
            fi
            git commit -m "Update BIH local EPG"
            if git push origin HEAD:main; then
              echo "Successfully pushed BIH local EPG"
              pushed=1
              break
            fi
            echo "Push rejected (concurrent push to main), retrying in 3s..."
            sleep 3
          done
          rm -rf "$BACKUP_DIR"
          if [ "$pushed" -ne 1 ]; then
            echo "Failed to push BIH local EPG after 5 attempts" >&2
            exit 1
          fi
