name: Import clean-v2 guide for TiviMate test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-clean-v2-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download clean-v2 guide-only artifact
        env:
          GUIDE_ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-2b9c-81fd-887f-0be3cc893e3c/raw?se=2026-10-05T05%3A35%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=56084ffd-4325-56b0-bfde-a127a4fe3927&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T17%3A55%3A49Z&ske=2026-10-05T17%3A55%3A49Z&sks=b&skv=2026-02-06&sig=PQYswBoG/HWmhUjRO6nB3n0cbU14DxGpIqFCXUkN2Pk%3D'
        run: |
          curl --fail --location --retry 3 "$GUIDE_ARTIFACT_URL" --output /tmp/clean-v2-guide.zip
          unzip -o /tmp/clean-v2-guide.zip guide.xml -d /tmp/clean-v2-guide
          cp /tmp/clean-v2-guide/guide.xml guide-clean-v2.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('guide-clean-v2.xml').getroot()
          if root.tag != 'tv':
              raise SystemExit('Downloaded file is not XMLTV')
          channels = root.findall('channel')
          programmes = root.findall('programme')
          if not channels or not programmes:
              raise SystemExit('Downloaded XMLTV is empty')
          print(f'Validated clean-v2 guide: {len(channels)} channels, {len(programmes)} programmes')
          PY

      - name: Publish test guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-clean-v2.xml
          if git diff --cached --quiet; then
            echo "guide-clean-v2.xml already current"
            exit 0
          fi
          git commit -m "Publish clean-v2 TiviMate test guide"
          git push
