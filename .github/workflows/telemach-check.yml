name: Provjera Telemach EPG

on:
  workflow_dispatch:
  pull_request:
    paths:
      - config/telemach-check.json
      - scripts/check_telemach.js
      - scripts/check_telemach.test.js
      - .github/workflows/telemach-check.yml
  push:
    branches: [main]
    paths:
      - config/telemach-check.json
      - scripts/check_telemach.js
      - scripts/check_telemach.test.js
      - .github/workflows/telemach-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Provjeri odabir programa
        run: node --test scripts/check_telemach.test.js
      - name: Preuzmi Telemach EPG alat
        # Pinned to a known-good commit of iptv-org/epg to prevent upstream breaking changes.
        # Commit: a047034a86e37ac4ed88adaceecf5df196165a46 (master branch as of 2026-10-01)
        # TODO: update this pin periodically (see docs/GRABBER_PINNING.md)
        run: |
          git init epg
          cd epg
          git remote add origin https://github.com/iptv-org/epg.git
          git fetch --depth 1 origin a047034a86e37ac4ed88adaceecf5df196165a46
          git checkout FETCH_HEAD
      - name: Instaliraj zavisnosti
        working-directory: epg
        run: npm ci
      - name: Provjeri pet kanala
        run: node scripts/check_telemach.js
      - name: Prikaži rezultate u sažetku
        run: cat reports/telemach-check.md >> "$GITHUB_STEP_SUMMARY"
      - name: Sačuvaj izvještaj i logotipe
        uses: actions/upload-artifact@v4
        with:
          name: telemach-epg-provjera
          path: reports/
          if-no-files-found: error
          retention-days: 7
